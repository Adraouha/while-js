<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Suma Iterativa</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: red;
        }

        button {
            padding: 10px;
            border-radius: 5px;
            border: none;
            background-color: rgb(255, 0, 0);
            color: white;
            cursor: pointer;

        }

        #resultado {
            display: block;
            margin-top: 20px;
            background-color: #f2f2f2;
            padding: 15px;
            border-radius: 10px;
            width: 50%;
            margin: auto;
            border: 1px solid rgb(255, 0, 0);

        }

        #resultado2 {
            display: block;
            margin-top: 20px;
            background-color: #f2f2f2;
            padding: 15px;
            border-radius: 10px;
            width: 50%;
            margin: auto;
            border: 1px solid rgb(255, 0, 0);
            margin-bottom: 30px;

        }

        .ejercicio3 {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            width: 50%;
            margin: auto;
            font-family: Arial;
            border: 1px solid rgb(255, 0, 0);


        }

        .texto {
            font-family: monospace;
            border-top: 2px solid rgb(247, 2, 2);
            border-bottom: 2px solid rgb(250, 5, 5);
            background-color: black;
            color: white;
            padding: 10px;

        }

        .ganador {
            color: #1b59df;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            animation: tictoc 2s infinite;

        }

        .perdedor {
            color: red;
            font-size: 20px;
            font-weight: bold;
            animation: tictoc 2s infinite;

        }

        @keyframes tictoc {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <h1>Suma iterativa de números </h1>
    <div style='display: flex; flex-direction: column; align-items: center; gap: 10px;'>

        <button style='margin: 10px auto; display: block;' onclick="iniciarPrograma()">Empezar</button>

        <div id="resultado">

        </div>
    </div>

    <!--EJERCICIO 2: Acumulador y Contador -->


    <h1>Acumulador y contador de números</h1>
    <div style='display: flex; flex-direction: column; align-items: center; gap: 10px;'>

        <button onclick="empezar()">Introducir números</button>

        <div id="resultado2"></div>
    </div>


    <div class="ejercicio3">
        <h1>¿Quién gana el premio?</h1>


        <button onclick="comprobarGanador()">Comprobar</button>

        <div id="carrera"></div>


    </div>








    <script>

        function iniciarPrograma() {

            let continuar = "S";
            let texto = "<div class='texto'>|||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||</div>";

            while (continuar === "S") {

                let num1 = Number(prompt("Introduce el primer número"));
                let num2 = Number(prompt("Introduce el segundo número"));

                let suma = num1 + num2;

                texto += `
      <p>
        ${num1} + ${num2} = <strong style='color: red;'>${suma}</strong>
      </p>
    `;

                continuar = prompt("¿Quieres continuar? (S/N)").toUpperCase();
            }
            texto += "<h3 style='text-align: center; color: red;'>Hasta luego! Espero que vuelvas pronto.</h3>";
            texto += "<div class='texto'>||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||</div>";

            document.getElementById("resultado").innerHTML = texto;
        }




        //ejecicio 2: en un bucle, pides números al usuario hasta que escriba un número negativo.

        function empezar() {

            let numero = 0;
            let sumaTotal = 0;
            let contador = 0;
            let texto = "";

            while (numero >= 0) {

                numero = Number(prompt("Introduce un número"));

                if (numero >= 0) {

                    sumaTotal += numero;
                    contador++;

                    texto += `<p>Número introducido (${contador}): <strong style='color: red;'>${numero}</strong></p>`;
                }
            }

            texto += `
            <div class='texto'>||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||</div>
            <h3 style='color: red; text-align: center;'>Has introducido un número negativo</h3>
            <p><strong>Suma total:</strong> <strong style='color: blue;'>${sumaTotal}</strong></p>
            <p><strong>Cantidad de números:</strong> <strong style='color: blue;'>${contador}</strong></p>
            <div class='texto'>||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||</div>
  `;

            document.getElementById("resultado2").innerHTML = texto;
        }




        //Ejercicio 3: ganador de premios de comida

        function comprobarGanador() {

            let nacionalidad = prompt("¿Cuál es tu nacionalidad?").toLowerCase();

            let comida = prompt("¿Qué comes?").toLowerCase();

            let resultado = document.getElementById("carrera");

            if (
                (nacionalidad === "valenciano" && comida === "galletas") ||
                (nacionalidad === "francés" && comida === "yogur") ||
                (nacionalidad !== "chino" && comida === "fideos")
            ) {

                carrera.innerHTML = `
      <p class="ganador">
        ¡Has ganado el primer premio!
      </p>
    `;

            } else {

                carrera.innerHTML = `
      <p class="perdedor">
        No has ganado el premio
      </p>
    `;
            }
        }


    </script>






</body>

</html>
